<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyclic Cellular Automaton</title>
  <meta name="description" content="Rock-paper-scissors cellular automata in the browser: run, tune the rules and watch spirals form.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3'%3E%3Crect width='3' height='3' fill='%23e62828'/%3E%3Crect x='1' width='2' height='1' fill='%232855e6'/%3E%3Crect y='1' width='1' height='2' fill='%23f5d000'/%3E%3Crect x='2' y='1' width='1' height='2' fill='%232855e6'/%3E%3Crect x='1' y='2' width='1' height='1' fill='%23f5d000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Cyclic cellular automaton</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-sim" aria-selected="true" aria-controls="page-sim">Simulation</button>
      <button role="tab" id="tab-settings" aria-selected="false" aria-controls="page-settings">Settings</button>
    </nav>
  </header>

  <main>
    <section id="page-sim" class="page" role="tabpanel" aria-labelledby="tab-sim">
      <aside class="controls">
        <fieldset>
          <legend>Run</legend>
          <div class="button-row">
            <button id="btn-run" class="primary" title="Start / pause (Space)">▶ Start</button>
            <button id="btn-step" title="One step (Right arrow)">Step</button>
            <button id="btn-stop" title="Pause and go back to the starting board (R)">■ Stop</button>
          </div>
          <label for="speed" id="speed-label">Speed: as fast as possible</label>
          <input type="range" id="speed" min="0" max="16" value="16">
        </fieldset>
        <fieldset>
          <legend>Starting board</legend>
          <div class="form-grid">
            <label for="pattern">Pattern</label>
            <select id="pattern"></select>
            <label for="param" id="param-label">Parameter</label>
            <input type="number" id="param">
            <label for="seed">Seed</label>
            <input type="number" id="seed" min="0" max="2147483646" value="0">
          </div>
          <label class="check"><input type="checkbox" id="new-seed" checked> New random seed each time</label>
          <button id="btn-create" class="wide">Create starting board</button>
        </fieldset>
        <fieldset>
          <legend>Panels</legend>
          <label class="check"><input type="checkbox" data-panel="board" checked> Board</label>
          <label class="check"><input type="checkbox" data-panel="average" checked> Average color</label>
          <label class="check"><input type="checkbox" data-panel="fading"> Fading average</label>
          <label class="check"><input type="checkbox" data-panel="activity" checked> Activity</label>
          <label class="check"><input type="checkbox" data-panel="histogram"> Color histogram</label>
          <label class="check"><input type="checkbox" data-panel="activityHist"> Activity histogram</label>
        </fieldset>
      </aside>

      <div id="panels" class="panels">
        <figure class="panel" data-panel="board">
          <figcaption>Board <span class="sub"></span></figcaption>
          <div class="panel-body"><canvas></canvas></div>
        </figure>
        <figure class="panel" data-panel="average">
          <figcaption>Average color <span class="sub"></span></figcaption>
          <div class="panel-body"><canvas></canvas></div>
        </figure>
        <figure class="panel" data-panel="fading">
          <figcaption>Fading average <span class="sub"></span></figcaption>
          <div class="panel-body"><canvas></canvas></div>
        </figure>
        <figure class="panel" data-panel="activity">
          <figcaption>Activity <span class="sub"></span></figcaption>
          <div class="panel-body"><canvas></canvas></div>
        </figure>
        <figure class="panel" data-panel="histogram">
          <figcaption>Color histogram <span class="sub">share of the current board (axis 0-100%)</span></figcaption>
          <div class="panel-body"><canvas class="chart"></canvas></div>
        </figure>
        <figure class="panel" data-panel="activityHist">
          <figcaption>Activity histogram <span class="sub"></span></figcaption>
          <div class="panel-body"><canvas class="chart"></canvas></div>
        </figure>
      </div>
    </section>

    <section id="page-settings" class="page" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <form id="settings-form" class="settings" autocomplete="off"></form>
    </section>
  </main>

  <footer id="status" class="status" aria-live="polite">Loading…</footer>

  <script type="module" src="js/main.js"></script>
  <script>
    // If the app can't start, say why instead of showing "Loading…" forever.
    (function () {
      var status = document.getElementById("status");
      if (location.protocol === "file:") {
        status.textContent = "This page can't run from a file: browsers block its scripts. "
          + "Serve the folder (e.g. python -m http.server) and open http://localhost:8000.";
        return;
      }
      setTimeout(function () {
        if (status.textContent === "Loading…") {
          status.textContent = "The app didn't start. Try a hard refresh (Ctrl+F5); "
            + "if it persists, the browser console (F12) shows the error.";
        }
      }, 5000);
    })();
  </script>
</body>
</html>
